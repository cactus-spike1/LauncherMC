name: Release build (multi-OS)

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/use (e.g. v0.1.0)"
        required: true
      create_release:
        description: "Create release if not exists (true/false)"
        required: false
        default: "true"

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Create release only for workflow_dispatch
      - name: Create release (manual run)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          gh release create "${{ github.event.inputs.tag }}" \
            --title "${{ github.event.inputs.tag }}" \
            --notes "Automated build from workflow_dispatch" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Resolve upload_url
      - name: Resolve release upload URL
        id: get_release
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          TAG="${{ github.event.inputs.tag }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"

          resp=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API")
          upload_url=$(echo "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin).get('upload_url',''))")
          upload_url="${upload_url%\{*}"

          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Locate built binaries
        id: find
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "launcher=target/release/LauncherMC.exe" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater.exe" >> $GITHUB_OUTPUT
          else
            echo "launcher=target/release/LauncherMC" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater" >> $GITHUB_OUTPUT
          fi

      - name: Install zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install zip

      - name: Package minecraft assets (if present)
        id: pkg_minecraft
        run: |
          out="minecraft-assets-${{ matrix.os }}.zip"
          files=()

          [ -f minecraft/minecraft.jar ] && files+=(minecraft/minecraft.jar)
          [ -d minecraft/local-libs ] && files+=(minecraft/local-libs)

          if [ ${#files[@]} -gt 0 ]; then
            zip -r "$out" "${files[@]}"
            echo "pkg=$out" >> $GITHUB_OUTPUT
          else
            echo "pkg=" >> $GITHUB_OUTPUT
          fi

      - name: Upload launcher
        run: |
          gh release upload "${{ github.event.inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.find.outputs.launcher }}" \
            --name "LauncherMC-${{ matrix.os }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater
        run: |
          gh release upload "${{ github.event.inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.find.outputs.updater }}" \
            --name "LauncherMCupdater-${{ matrix.os }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload minecraft assets (if packaged)
        if: steps.pkg_minecraft.outputs.pkg != ''
        run: |
          gh release upload "${{ github.event.inputs.tag || github.event.release.tag_name }}" \
            "${{ steps.pkg_minecraft.outputs.pkg }}" \
            --name "minecraft-assets-${{ matrix.os }}.zip" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
