name: Release build (ArchLinux-only)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0)"
        required: true
      create_release:
        description: "Create release if not exists"
        default: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel \
            git \
            rustup \
            mingw-w64-gcc \
            zip \
            github-cli

          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Linux binaries
        run: cargo build --release --bins

      - name: Build Windows binaries (cross-compile)
        run: cargo build --release --bins --target x86_64-pc-windows-gnu

      - name: Prepare output files
        run: |
          mkdir out

          # Linux
          cp target/release/LauncherMC out/LauncherMC-linux
          cp target/release/LauncherMCupdater out/LauncherMCupdater-linux

          # Windows
          cp target/x86_64-pc-windows-gnu/release/LauncherMC.exe out/LauncherMC-windows.exe
          cp target/x86_64-pc-windows-gnu/release/LauncherMCupdater.exe out/LauncherMCupdater-windows.exe

      - name: Package minecraft assets
        run: |
          if [ -f minecraft/minecraft.jar ]; then
            cp minecraft/minecraft.jar out/minecraft.jar
          fi

          if [ -d minecraft/local-libs ]; then
            zip -r out/local-libs.zip minecraft/local-libs
          fi

      - name: Create release if needed
        if: github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "ArchLinux cross-platform build" \
              --repo "${{ github.repository }}"
          fi

      - name: Upload artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag }}"
          gh release upload "$TAG" out/* --clobber --repo "${{ github.repository }}"
