name: Release build (multi-OS)

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/use (e.g. v0.1.0)"
        required: true
      create_release:
        description: "Create release if not exists (true/false)"
        required: false
        default: "true"

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.get_release.outputs.upload_url }}
      tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Set tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create release if needed
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated build" \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve upload_url
        id: get_release
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          API="https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG"
          resp=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" "$API")
          upload_url=$(echo "$resp" | python3 -c "import sys, json; print(json.load(sys.stdin).get('upload_url',''))")
          upload_url="${upload_url%\{*}"
          echo "upload_url=$upload_url" >> $GITHUB_OUTPUT

  build:
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Locate built binaries
        id: find
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "launcher=target/release/LauncherMC.exe" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater.exe" >> $GITHUB_OUTPUT
          else
            echo "launcher=target/release/LauncherMC" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater" >> $GITHUB_OUTPUT
          fi

      - name: Upload launcher
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            "${{ steps.find.outputs.launcher }}" \
            --name "LauncherMC-${{ matrix.os }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            "${{ steps.find.outputs.updater }}" \
            --name "LauncherMCupdater-${{ matrix.os }}" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
