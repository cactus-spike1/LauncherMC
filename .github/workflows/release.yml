name: Release build (multi-OS)

permissions:
  contents: write

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/use (e.g. v0.1.0)"
        required: true
      create_release:
        description: "Create release if not exists (true/false)"
        required: false
        default: "true"

jobs:
  prepare_release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.set_tag.outputs.tag }}

    steps:
      - name: Set tag
        id: set_tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          fi

      - name: Install GitHub CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y gh

      - name: Create release if needed
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        run: |
          TAG="${{ steps.set_tag.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "Release already exists."
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "Automated build" \
              --repo "${{ github.repository }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: prepare_release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build release binaries
        run: cargo build --release --bins

      - name: Locate built binaries
        id: find
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            echo "launcher=target/release/LauncherMC.exe" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater.exe" >> $GITHUB_OUTPUT
          else
            echo "launcher=target/release/LauncherMC" >> $GITHUB_OUTPUT
            echo "updater=target/release/LauncherMCupdater" >> $GITHUB_OUTPUT
          fi

      - name: Install zip (Windows)
        if: matrix.os == 'windows-latest'
        run: choco install zip

      - name: Package minecraft assets (if present)
        id: pkg_minecraft
        run: |
          out="minecraft-assets-${{ matrix.os }}.zip"
          files=()

          [ -f minecraft/minecraft.jar ] && files+=(minecraft/minecraft.jar)
          [ -d minecraft/local-libs ] && files+=(minecraft/local-libs)

          if [ ${#files[@]} -gt 0 ]; then
            zip -r "$out" "${files[@]}"
            echo "pkg=$out" >> $GITHUB_OUTPUT
          else
            echo "pkg=" >> $GITHUB_OUTPUT
          fi

      - name: Upload launcher
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
          target/release/LauncherMC \
          --asset-name "LauncherMC-${{ matrix.os }}" \
          --clobber \
          --repo "${{ github.repository }}"

      - name: Upload updater
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            target/release/LauncherMCupdater \
            --asset-name "LauncherMCupdater-${{ matrix.os }}" \
            --clobber \
            --repo "${{ github.repository }}"

      - name: Upload minecraft.jar (if present)
        if: hashFiles('minecraft/minecraft.jar') != ''
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            "minecraft/minecraft.jar" \
            --name "minecraft.jar" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload local-libs.zip (if present)
        if: hashFiles('minecraft/local-libs.zip') != ''
        run: |
          gh release upload "${{ needs.prepare_release.outputs.tag }}" \
            "minecraft/local-libs.zip" \
            --name "local-libs.zip" \
            --repo "${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
