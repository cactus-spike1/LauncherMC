name: Release build

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (e.g. 0.1.0)"
        required: true
        type: string
      create_release:
        description: "Create release if not exists"
        default: true
        required: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm \
            base-devel \
            git \
            rustup \
            mingw-w64-gcc \
            github-cli

          rustup default stable
          rustup target add x86_64-pc-windows-gnu

      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Cargo files
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-arch-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-arch-cargo-

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
          CREATE_RELEASE: ${{ inputs.create_release }}
        run: |
          bash scripts/release.sh "$RELEASE_VERSION" "$CREATE_RELEASE"
